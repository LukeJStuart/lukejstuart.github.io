name: Build and check site
description: Install Hugo, build the site into public/, and link-check the output.

inputs:
  base-url:
    description: Absolute base URL to build against, with trailing slash.
    required: true
  hugo-version:
    description: Version of Hugo Extended to install.
    required: false
    default: 0.160.1

runs:
  using: composite
  steps:
    - name: Install Hugo CLI
      shell: bash
      env:
        HUGO_VERSION: ${{ inputs.hugo-version }}
      run: |
        wget -O "${{ runner.temp }}/hugo.deb" \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
        sudo dpkg -i "${{ runner.temp }}/hugo.deb"

    - name: Build with Hugo
      shell: bash
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: |
        hugo \
          --gc \
          --minify \
          --printI18nWarnings \
          --printPathWarnings \
          --baseURL "${{ inputs.base-url }}"

    # --root-dir is required for the site's root-relative links (/css/main.css)
    # to resolve against the build output instead of erroring.
    - name: Check links
      uses: lycheeverse/lychee-action@v2
      with:
        args: --no-progress --root-dir ${{ github.workspace }}/public public/
        fail: true
