name: CI

on:
  pull_request:
    branches: [main]
    # 'edited' is what catches a base-branch change. Without it, retargeting a
    # stacked PR onto main lands it here with no checks at all.
    types: [opened, synchronize, reopened, edited]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build and check
        uses: ./.github/actions/build-and-check
        with:
          base-url: https://ljs.me.uk/
